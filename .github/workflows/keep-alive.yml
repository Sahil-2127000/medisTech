name: Keep Render backend awake

# Render's free plan sleeps after 15 minutes without traffic, so the first request
# then takes ~1 minute. Ping every 10 minutes during the day only:
#   02:00–17:59 UTC  =  07:30–23:29 IST  (~500 hours/month).
# Render gives each workspace 750 free hours/month shared by all free services;
# pinging 24/7 would use them all and suspend every free service.
on:
  schedule:
    - cron: '*/10 2-17 * * *'
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 15 https://medistech-backend.onrender.com/api/health
